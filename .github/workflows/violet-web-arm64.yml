name: Violet Web ARM64 image

on:
  pull_request:
    paths:
      - 'violet-web/**'
      - '.github/workflows/violet-web-arm64.yml'
      - 'docker-compose.image.yml'
      - 'scripts/deploy-violet-web-image.sh'
  push:
    branches: [main]
    paths:
      - 'violet-web/**'
      - '.github/workflows/violet-web-arm64.yml'
      - 'docker-compose.image.yml'
      - 'scripts/deploy-violet-web-image.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: violet-web-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Verify Pi deployment helper syntax
        run: bash -n scripts/deploy-violet-web-image.sh

      - name: Set GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/violet-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ./violet-web
          file: ./violet-web/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=violet-web-arm64
          cache-to: type=gha,mode=max,scope=violet-web-arm64

      - name: Check Node and native SQLite module
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$TEST_IMAGE" | grep -Fx linux/arm64
          docker run --rm --entrypoint node "$TEST_IMAGE" -v
          docker run --rm --entrypoint node "$TEST_IMAGE" -e \
            'const Database=require("better-sqlite3");const db=new Database(":memory:");if(db.prepare("SELECT 1 AS v").get().v!==1)process.exit(1);db.close()'

      # PR builds never publish; only code merged to main gets distributed.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested ARM64 image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main-arm64"
          docker push "$IMAGE:main-arm64"
          {
            echo '### Violet Web ARM64 image ready'
            echo "`$IMAGE:sha-$GITHUB_SHA`"
            echo 'Deploy on Pi using:'
            echo '```bash'
            echo "bash scripts/deploy-violet-web-image.sh $IMAGE:sha-$GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
