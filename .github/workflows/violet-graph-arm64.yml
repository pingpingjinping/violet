name: Violet Graph ARM64 image

on:
  pull_request:
    paths:
      - 'violet-graph/**'
      - '.github/workflows/violet-graph-arm64.yml'
      - 'docker-compose.yml'
  push:
    branches: [main]
    paths:
      - 'violet-graph/**'
      - '.github/workflows/violet-graph-arm64.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: violet-graph-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/violet-graph" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build ARM64 graph image
        uses: docker/build-push-action@v6
        with:
          context: ./violet-graph
          file: ./violet-graph/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=violet-graph-arm64
          cache-to: type=gha,mode=max,scope=violet-graph-arm64

      - name: Check image architecture and graph executable
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$TEST_IMAGE" | grep -Fx linux/arm64
          docker run --rm "$TEST_IMAGE" serve --help

      # PR builds are test-only; publish images only from merged main.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ARM64 image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main-arm64"
          docker push "$IMAGE:main-arm64"
          {
            echo '### Violet Graph ARM64 image ready'
            echo "`$IMAGE:sha-$GITHUB_SHA`"
            echo 'After updating the Pi checkout, deploy only graph:'
            echo '```bash'
            echo 'docker compose --profile extra pull graph'
            echo 'docker compose --profile extra up -d --no-deps --no-build graph'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
