name: Fast hsync artist metadata tests

on:
  push:
    branches: [main]
    paths:
      - 'fast-hsync/**'
      - '.github/workflows/test-fast-hsync.yml'
  pull_request:
    paths:
      - 'fast-hsync/**'
      - '.github/workflows/test-fast-hsync.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fast-hsync/go.mod
          cache-dependency-path: fast-hsync/go.sum
      - name: Go unit tests
        working-directory: fast-hsync
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python artist backfill tests
        working-directory: fast-hsync
        run: python3 -m unittest -v test_backfill_artists.py test_backfill_groups.py test_audit_artist_mismatches.py test_rank_artist_mismatch_candidates.py test_audit_eh_metadata.py
