volumes:
  violet-content-db:

services:
  content-db-init:
    image: alpine:3.21
    command:
      - /bin/sh
      - -ec
      - |
        if [ -s /content-data/data.db ]; then
          exit 0
        fi
        cp /seed/data.db /content-data/data.db
        for suffix in -wal -shm; do
          if [ -f "/seed/data.db$$suffix" ]; then
            cp "/seed/data.db$$suffix" "/content-data/data.db$$suffix"
          fi
        done
    volumes:
      - ${VIOLET_DATA_ROOT:-/home/pi/violet-data}:/seed:ro
      - violet-content-db:/content-data
    restart: "no"

  hsync:
    build:
      context: ./fast-hsync
    image: violet/fast-hsync:local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        slot_seconds=21600
        retry_seconds=3600

        seconds_until_next_slot() {
          hour=$$(date +%H); hour=$${hour#0}; [ -n "$$hour" ] || hour=0
          minute=$$(date +%M); minute=$${minute#0}; [ -n "$$minute" ] || minute=0
          second=$$(date +%S); second=$${second#0}; [ -n "$$second" ] || second=0
          since_midnight=$$((hour * 3600 + minute * 60 + second))
          remainder=$$((since_midnight % slot_seconds))
          if [ "$$remainder" -eq 0 ]; then
            echo 0
          else
            echo $$((slot_seconds - remainder))
          fi
        }

        while true; do
          wait_seconds=$$(seconds_until_next_slot)
          echo "[fast-hsync] waiting $${wait_seconds}s for next KST slot (00/06/12/18)"
          sleep "$$wait_seconds"

          while true; do
            echo "[fast-hsync] starting scheduled sync at $$(date '+%Y-%m-%d %H:%M:%S %Z')"
            fast-hsync /content-data/data.db
            status=$$?
            if [ "$$status" -eq 0 ]; then
              echo "[fast-hsync] scheduled sync completed"
              sleep 1
              break
            fi

            echo "[fast-hsync] scheduled sync failed with exit code $$status; retrying in $${retry_seconds}s" >&2
            sleep "$$retry_seconds"
          done
        done
    environment:
      TZ: Asia/Seoul
      FAST_HSYNC_QUIET: "1"
    volumes:
      - violet-content-db:/content-data
    depends_on:
      content-db-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  graph:
    profiles: ["extra"]
    build:
      context: ./violet-graph
    image: violet/graph:local
    mem_limit: 800m
    memswap_limit: 2500m
    command:
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--input"
      - "/data/graph.csv"
      - "--port"
      - "8787"
    ports:
      - "8787:8787"
    volumes:
      - ${VIOLET_GRAPH_DATA:-/home/pi/violet-data/graph.csv}:/data/graph.csv:ro
    restart: unless-stopped

  web:
    build:
      context: ./violet-web
    image: violet/web:local
    environment:
      DATA_DB_PATH: /content-data/data.db
      USER_DB_PATH: /app/data/user.db
      KEYWORD_GRAPH_BASE_URL: http://graph:8787
      SYNC_ENABLED: "false"
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - ./violet-web/packages/backend/data:/app/data
      - ./violet-web/packages/backend/data/suggestion-cache.json:/app/suggestion-cache.json
      - violet-content-db:/content-data
    depends_on:
      content-db-init:
        condition: service_completed_successfully
      #graph:
        #condition: service_started
    restart: unless-stopped
